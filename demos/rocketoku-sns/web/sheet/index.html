<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>掲載したいイベント</title>
<style>
  body { margin: 0; font-family: "IPAGothic", "Hiragino Sans", "Meiryo", sans-serif; background: #fff; color: #202124; }
  .bar { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid #dadce0; }
  .bar .icon { width: 26px; height: 26px; background: #188038; border-radius: 4px; color: #fff; font-size: 15px; text-align: center; line-height: 26px; }
  table { border-collapse: collapse; font-size: 12.5px; margin: 10px 14px; }
  th, td { border: 1px solid #e2e3e5; padding: 6px 8px; vertical-align: top; text-align: left; }
  th { background: #e6f4ea; }
  .note { margin: 4px 14px; font-size: 12.5px; color: #5f6368; }
</style>
</head>
<body>
<div class="bar"><div class="icon">▦</div><div>ロケふる加盟店のイベント（観光サイト掲載用・架空データ）</div></div>
<table>
  <thead><tr><th>No</th><th>イベント名</th><th>主催（加盟店）</th><th>開催日</th><th>時間</th><th>会場</th><th>料金</th><th>問い合わせ</th><th>紹介文の素材</th></tr></thead>
  <tbody id="rows"></tbody>
</table>
<p class="note">※ 掲載先：観光サイトA・Bの両方。料金はロケふるで支払い可能（倉敷市外にお住まいの方）。</p>
<script>
  const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  fetch("/api/events").then(r => r.json()).then(rows => {
    document.getElementById("rows").innerHTML = rows.map((e, i) =>
      `<tr><td>${i + 1}</td><td>${esc(e.title)}</td><td>${esc(e.merchant)}</td><td>${esc(e.date)}</td><td>${esc(e.time)}</td><td>${esc(e.place)}</td><td>${esc(e.price)}</td><td>${esc(e.contact)}</td><td>${esc(e.description)}</td></tr>`).join("");
  });
</script>
</body>
</html>

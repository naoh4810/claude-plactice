# 記事のトピックキュー（フォールバック用）
#
# Notion連携が有効な場合は「デイリー学習ログ」から未使用の学びを自動で拾います。
# Notionを使わない／ログを使い切った場合は、この下のリストを上から順に消化します。
# 記事化したいテーマを自由に追加してください。

# 記事全体の方針（プロンプトに渡される）
settings:
  # 想定読者
  audience: "中小企業の経営者・現場担当者、これからAIを業務に取り入れたい人（AI初心者〜中級）"
  # 文体・トーン
  tone: "製造業の現場出身でAIコンサルをしている実務家として、実体験ベースで具体的に。専門用語はかみ砕く。煽らない。"
  # 1記事の目安文字数
  target_chars: 2500
  # 記事に必ず入れる要素
  must_include:
    - "つまずいた点と、それをどう解決したか（失敗談を歓迎）"
    - "明日から真似できる具体的な手順 or チェックリスト"
    - "この学びが実務のどんな課題を解決するか"

# フォールバックのトピック（Notionログが無いときに使用）
queue:
  - title: "Make（旧Integromat）で問い合わせ自動振り分けを作る"
    hint: "Router＋フィルターで資料請求/一般を仕分け、Gmail自動送信。403スコープエラーの解決も。"
  - title: "Difyをセルフホストして社外にデータを出さないAI環境を作る"
    hint: "Docker Composeでの構築、クラウド版からのDSL移送、月額ゼロ運用。"
  - title: "Claude CodeとMCP連携で何ができるようになったか"
    hint: "環境構築からGit連携・外部ツール接続まで。非エンジニアが最初にやるべきこと。"
  - title: "AI議事録ツールの作り方：音声→文字起こし→構造化→Notion登録"
    hint: "会議後30分〜1時間の議事録作成をゼロにした導線。"
  - title: "経営者向けAI研修で最初に伝えるべき3つのこと"
    hint: "社員への広め方、独立リスク、社長が先陣を切る意味。"

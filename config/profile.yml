# プロフィールDB（案件の判定と応募文生成に使う「自分の情報」）
#
# ここに書いた内容だけを根拠に、Claude が 〇推奨 / △挑戦 / ×見送り を判定し、応募文を書きます。
# 書いていない実績・資格は応募文に出てきません（盛らない設計）。正直に、具体的に書くほど精度が上がります。
# 【要記入】の箇所を自分の情報に置き換えてください。

name: "【要記入】表示名（各サイトのユーザー名）"

# 一言でいうと何ができる人か（応募文の冒頭に使う）
headline: "製造業の現場出身。生成AI（ChatGPT/Claude）と業務自動化で、現場の手作業を減らすお手伝いをしています。"

# できること（スキル）。level: 実務 / 学習中 / 少し
skills:
  - name: "ChatGPT・Claude の業務活用（プロンプト設計、社内向け使い方レクチャー）"
    level: 実務
  - name: "Python（スクレイピング、CSV/Excel 集計、API 連携）"
    level: 学習中
  - name: "ノーコード自動化（Make / Zapier / GAS）"
    level: 学習中
  - name: "ブログ・解説記事の執筆（AI・業務効率化テーマ）"
    level: 実務
  - name: "製造業の現場業務（品質管理・生産管理などの実務経験）"
    level: 実務

# 実績（応募文で引用してよい事実だけ）。数字があれば入れる
achievements:
  - "【要記入】例: 製造業で◯年、◯◯工程の改善を担当"
  - "【要記入】例: AI活用記事を◯本執筆（ブログURL）"

# ポートフォリオ・参考URL
portfolio:
  - "【要記入】https://..."

# 稼働条件
availability:
  hours_per_week: 10          # 【要記入】週あたりの稼働時間
  contact_hours: "平日夜・土日" # 【要記入】連絡がつきやすい時間帯
  can_meet_online: true        # オンライン打合せ可否

# 単価の目安（下回ると減点。極端に低いものは見送り）
rate:
  min_hourly_yen: 1000         # 時給換算の下限
  min_per_article_yen: 3000    # 記事1本の下限
  min_project_yen: 5000        # 固定報酬案件の下限

# 積極的に取りたい案件のキーワード（加点）
want_keywords:
  - ChatGPT
  - 生成AI
  - 業務効率化
  - 自動化
  - Python
  - GAS
  - 記事作成
  - 製造業

# これに当てはまったら即 ×見送り（Claude に聞く前に機械的に弾く。API代の節約にもなる）
ng_keywords:
  - 初期費用
  - 教材購入
  - LINE登録
  - 情報商材
  - テレアポ
  - 出会い系
  - アダルト

# 判定の補足ルール（自由記述。Claude にそのまま渡す）
notes: |
  - 実績づくりの段階なので、単価がやや低くても「実績・評価がつきやすい小さめの案件」は △挑戦 にしてよい。
  - 常駐・出社必須、フルタイム前提の案件は見送り。
  - サイト外（LINE・メール等）での直接取引や、応募前の個人情報要求がある案件は見送り。

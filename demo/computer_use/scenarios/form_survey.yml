title: アンケート回答の集計と報告
audience: 福祉・障害者支援事業所、スクール、サロンなど（フォームで回答を集めている事業者）
pitch: >-
  フォームの回答を印刷して書き写す作業を、AIがパソコンを操作して代わりにやります。
  回答を表に転記し、事業所ごとの満足度を計算して、要点をSlackに報告するところまで自動です。
# 実演の目安時間（分）
minutes: 4
task: |
  利用者アンケートの回答を集計して、チームに報告してください。

  1. Firefox で http://localhost:8080/site/form/ を開く（アンケートの回答一覧ページ）。
  2. LibreOffice Calc を開き、回答一覧の表（ヘッダー行を含む全行）を A1 から転記する。
     ページの表をドラッグで選択してコピーし、Calc に貼り付けてよい。
  3. 表の右側に「事業所別の集計」を作る：事業所ごとの回答数と満足度の平均（小数1桁）。
     数値は AVERAGEIF / COUNTIF などの数式で計算する。
  4. ホームフォルダに「アンケート集計.xlsx」という名前で保存する（Excel 2007-365 形式）。
  5. 自由記述欄から多かった困りごとを3つにまとめ、post_to_slack で報告する。
     報告には、回答数、全体の満足度平均、事業所別の平均、困りごとトップ3、
     保存したファイル名を含める。

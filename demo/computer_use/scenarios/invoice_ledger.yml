title: 請求書PDFの台帳転記とインボイスチェック
audience: 税理士・司法書士・会計事務所、経理担当者がいる中小企業
pitch: >-
  届いた請求書PDFをAIが1枚ずつ開いて読み取り、台帳に転記します。
  インボイス登録番号の記載漏れや金額の計算違いも、その場でチェックして報告します。
minutes: 5
task: |
  今月届いた請求書を台帳にまとめて、チームに報告してください。

  1. Firefox で http://localhost:8080/site/invoices/ を開く（受信した請求書の一覧ページ）。
  2. LibreOffice Calc を開き、1行目に次の見出しを作る：
     発行元 / 請求日 / 支払期限 / 税抜金額 / 消費税 / 税込合計 / 登録番号 / チェック
  3. 一覧にある請求書PDFを1つずつ開き、上の項目を読み取って1行ずつ転記する。
     細かい文字が読みにくいときは拡大して確認する。
  4. 「チェック」列には次のような問題があれば書く（なければ「OK」）：
     - 登録番号（T＋13桁）の記載がない
     - 税抜金額＋消費税が税込合計と一致しない
  5. 最終行に税込合計の合計を SUM 関数で出す。
  6. ホームフォルダに「請求書台帳.xlsx」という名前で保存する（Excel 2007-365 形式）。
  7. post_to_slack で報告する：請求書の件数、税込合計の総額、支払期限が近い順の一覧、
     チェックで見つかった問題と、取引先への確認が必要な点。

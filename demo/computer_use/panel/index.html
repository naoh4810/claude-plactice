<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI操作デモ</title>
<style>
  :root { --bg: #0f172a; --panel: #111827; --card: #1f2937; --text: #e5e7eb; --muted: #9ca3af; --accent: #f59e0b; --ok: #34d399; --err: #f87171; }
  * { box-sizing: border-box; }
  body { margin: 0; height: 100vh; display: flex; background: var(--bg); color: var(--text); font-family: "Noto Sans CJK JP", "Hiragino Sans", sans-serif; }
  #screen { flex: 1; display: flex; flex-direction: column; min-width: 0; padding: 12px; gap: 8px; }
  #screen h1 { margin: 0; font-size: 18px; font-weight: 600; }
  #screen h1 span { color: var(--muted); font-weight: 400; font-size: 14px; margin-left: 8px; }
  iframe { flex: 1; width: 100%; border: 1px solid #374151; border-radius: 8px; background: #000; }
  aside { width: 400px; background: var(--panel); display: flex; flex-direction: column; border-left: 1px solid #374151; }
  #scenarios { padding: 12px; display: flex; flex-direction: column; gap: 8px; border-bottom: 1px solid #374151; }
  .card { background: var(--card); border-radius: 8px; padding: 10px 12px; }
  .card h2 { margin: 0 0 4px; font-size: 15px; }
  .card p { margin: 0 0 8px; font-size: 12px; color: var(--muted); line-height: 1.5; }
  button { border: 0; border-radius: 6px; padding: 7px 14px; font-size: 14px; cursor: pointer; font-family: inherit; }
  .run { background: var(--accent); color: #111; font-weight: 600; }
  .run:disabled { opacity: .4; cursor: default; }
  #stop { background: #374151; color: var(--text); margin: 0 12px 8px; }
  #log { flex: 1; overflow-y: auto; padding: 8px 12px 16px; font-size: 14px; line-height: 1.6; }
  .ev { margin: 6px 0; display: flex; gap: 8px; }
  .ev time { color: var(--muted); font-size: 11px; padding-top: 3px; flex: none; }
  .note { font-size: 15px; }
  .action { color: var(--muted); font-size: 12px; }
  .slack { background: #3f2a56; border-radius: 6px; padding: 8px; white-space: pre-wrap; }
  .done { color: var(--ok); font-weight: 600; }
  .error { color: var(--err); }
  .scenario { color: var(--accent); font-weight: 600; border-top: 1px solid #374151; padding-top: 8px; }
</style>
</head>
<body>
<section id="screen">
  <h1>AIがパソコンを操作しています<span>マウスもキーボードも、人は触っていません</span></h1>
  <iframe id="vnc" title="仮想デスクトップ"></iframe>
</section>
<aside>
  <div id="scenarios"></div>
  <button id="stop">停止</button>
  <div id="log"></div>
</aside>
<script>
  const host = location.hostname;
  document.getElementById("vnc").src =
    `http://${host}:6080/vnc.html?autoconnect=1&resize=scale&view_only=1&show_dot=1`;

  const ICON = { note: "💬", action: "🖱", slack: "📣 Slackに報告", status: "▶", done: "✅", error: "⚠️", scenario: "🎬" };
  const log = document.getElementById("log");
  let running = false;

  function setRunning(v) {
    running = v;
    document.querySelectorAll(".run").forEach(b => (b.disabled = v));
  }

  async function loadScenarios() {
    const res = await fetch("/api/scenarios");
    const data = await res.json();
    const box = document.getElementById("scenarios");
    for (const s of data.scenarios) {
      const card = document.createElement("div");
      card.className = "card";
      card.innerHTML = `<h2></h2><p></p>`;
      card.querySelector("h2").textContent = `${s.title}（約${s.minutes}分）`;
      card.querySelector("p").textContent = s.pitch;
      const btn = document.createElement("button");
      btn.className = "run";
      btn.textContent = "▶ 実行";
      btn.onclick = async () => {
        setRunning(true);
        const r = await fetch("/api/run", { method: "POST", body: JSON.stringify({ id: s.id }) });
        if (!r.ok) { alert((await r.json()).error); }
      };
      card.appendChild(btn);
      box.appendChild(card);
    }
    setRunning(data.running);
  }

  document.getElementById("stop").onclick = () => fetch("/api/stop", { method: "POST" });

  const es = new EventSource("/api/events");
  es.onmessage = (m) => {
    const ev = JSON.parse(m.data);
    if (ev.type === "idle") { setRunning(false); return; }
    if (ev.type === "scenario") setRunning(true);
    const row = document.createElement("div");
    row.className = `ev ${ev.type}`;
    const t = document.createElement("time");
    t.textContent = ev.ts;
    const body = document.createElement("div");
    body.textContent = `${ICON[ev.type] || ""} ${ev.text}`;
    if (ev.type === "slack") body.className = "slack";
    row.append(t, body);
    log.appendChild(row);
    log.scrollTop = log.scrollHeight;
  };

  loadScenarios();
</script>
</body>
</html>

name: Daily AI Article

# 毎日 07:00 JST（22:00 UTC）に記事を1本生成してコミットする。
# 手動実行（Actionsタブの Run workflow）でもすぐ試せる。
on:
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate article
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DAILY_LOG_DATABASE_ID: ${{ secrets.NOTION_DAILY_LOG_DATABASE_ID }}
          ARTICLE_MODEL: ${{ vars.ARTICLE_MODEL }}
          ENABLE_WEB_SEARCH: ${{ vars.ENABLE_WEB_SEARCH }}
        run: python scripts/generate_article.py

      - name: Commit and push if there are changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain articles state)" ]; then
            git add articles state
            git commit -m "chore: add daily article ($(date +%Y-%m-%d))"
            git push
          else
            echo "生成された変更はありませんでした。"
          fi
